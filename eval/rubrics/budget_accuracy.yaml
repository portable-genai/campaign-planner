# Budget-reconciliation accuracy rubric for D2.
#
# The deterministic allocation and the pacing calendar must each sum back to the requested
# total budget (within a small currency rounding tolerance), and every plan must always
# carry the human-review flag (nothing spend-affecting auto-executes).
metric: budget_accuracy
threshold: 1.0
rationale: >-
  Raised from 0.99 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case over
  6 cases, so a single failure gives 0.833, already below 0.99: the bar required 6 of 6 while
  reading as though it priced one failure in. 1.0 says the same thing out loud. Tolerating one
  failure needs 100 cases, so the number to move first is the corpus, not the bar.
description: >-
  Fraction of golden cases where the channel-mix allocation AND the flight pacing reconcile
  to the requested total budget within tolerance.
companion_metrics:
  review_safety:
    threshold: 1.0
    rationale: >-
      Raised from 0.99 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case
      over 6 cases, so a single failure gives 0.833, already below 0.99: the bar required 6 of 6
      while reading as though it priced one failure in. 1.0 says the same thing out loud.
      Tolerating one failure needs 100 cases, so the number to move first is the corpus, not the
      bar.
    description: >-
      Fraction of plans that correctly set requires_human_review=True (maker-checker).
