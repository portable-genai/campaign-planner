# Groundedness rubric for the D2 campaign plan.
#
# Every figure in the plan (each selected segment and each budget line) must be backed by at
# least one Citation. The offline gate (eval/run_eval.py) enforces the threshold below; the
# production Gen AI evaluation service uses the same metric name pre-promotion.
metric: plan_groundedness
threshold: 0.80
description: >-
  Fraction of plans whose selected segments and budget lines all carry at least one
  citation. A plan built on uncited figures fails.
companion_metrics:
  citation_accuracy:
    threshold: 1.0
    rationale: >-
      Raised from 0.9 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case
      over 6 cases, so a single failure gives 0.833, already below 0.9: the bar required 6 of 6
      while reading as though it priced one failure in. 1.0 says the same thing out loud.
      Tolerating one failure needs 10 cases, so the number to move first is the corpus, not the
      bar.
    description: >-
      Fraction of cited source ids that appear in the derived evidence set (no fabricated
      citations).
